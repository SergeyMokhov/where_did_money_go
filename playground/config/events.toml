# Significant life events for the Futurama playground household.
# These render as amber vertical markers on the "Cash flow over time" chart so
# you can see how each milestone lined up with the money. (You can also add your
# own from the report UI — those show up in purple and are saved in your browser.)

schema_version = 1

[[event]]
date  = "2997-01-01"
label = "Crew starts at Planet Express"
note  = "Farnsworth payroll begins"

[[event]]
date  = "2998-08-12"
label = "Mars Vegas getaway"
note  = "$5,500 resort splurge"

[[event]]
date  = "2999-06-10"
label = "Fry's inheritance"
note  = "$50,000 from the Estate of Yancy Fry Sr"

[[event]]
date  = "2999-07-01"
label = "Bender's factory job ends"
note  = "IRONWORKS payroll stops — income drops as gambling peaks"
