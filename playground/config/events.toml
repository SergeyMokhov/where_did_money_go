# Significant life events for the Futurama playground household.
# These render as overlays on the "Cash flow over time" chart — points as vertical
# markers, ranges (with an `end`) as shaded bands, each in its own colour — so you
# can see how a milestone lined up with the money. (You can also add your own from
# the report UI; they're saved in your browser. Click any event to hide/show it.)
#
# Two OVERLAPPING money-leak periods (easter eggs) — each is a steady monthly
# subscription you can also find in "Recurring & subscriptions". Their bands
# overlap through 2998, where the shading stacks.

schema_version = 1

[[event]]
date  = "2997-09-06"
end   = "2998-12-06"
label = "Fry's gym he forgot to cancel"
note  = "JOG-O-TRON GYM $44.99/mo — 16 months; he went twice"

[[event]]
date  = "2998-05-06"
end   = "2998-10-06"
label = "Bender's booze-of-the-month club"
note  = "LOBRAU PLATINUM CLUB $89.99/mo on the card he never pays off"
