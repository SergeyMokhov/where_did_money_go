# where-did-money-go — PLAYGROUND categories (Futurama-themed demo data, year 2999)
#
# Tuned to the merchants emitted by generate_data.py. Most-specific (longest)
# matching pattern wins, then priority, then order. Unanchored, case-insensitive.

schema_version = 1

[[category]]
name = "Car"
kind = "spend"
  [[category.subcategory]]
  name = "Gas"
  patterns = ["PLASMA FUEL", "PETRO-?EARTH", "FUEL DEPOT"]
  [[category.subcategory]]
  name = "Starship Fuel"
  # Dark-matter fuel for the Planet Express delivery shuttle. Longer than the
  # bare "FUEL DEPOT" gas pattern, so it wins.
  patterns = ["DARK MATTER FUEL", "ANTIMATTER", "SHUTTLE FUEL"]

[[category]]
name = "Groceries"
kind = "spend"
  [[category.subcategory]]
  name = "Groceries"
  patterns = ["SLURM MART", "FISHY JOE", "BUY N LARGE", "MOMCORP MART"]

[[category]]
name = "Takeout & Restaurants"
kind = "spend"
  [[category.subcategory]]
  name = "Coffee"
  patterns = ["CAFE 3000", "COFFEE", "CAFE"]
  amount_max = "20.00"
  [[category.subcategory]]
  name = "Restaurants"
  patterns = ["ELZAR", "PANUCCI", "JACKRABBIT", "DINER", "RESTAURANT", "PIZZA"]
  [[category.subcategory]]
  name = "Gas-Station Snacks"
  # The gas-station sandwich counter — a certain delivery boy's weakness.
  patterns = ["GAS-N-GULP", "SANDWICH", "SLURM SHACK"]

[[category]]
name = "Pets"
kind = "spend"
  [[category.subcategory]]
  # Matches the default subcategory name so Nibbler's vet bills (also caught by
  # the default "VET" pattern) don't split into two rows.
  name = "Pet Supplies & Vet"
  # Leela's pet Nibbler: vet, exotic chow, supplies.
  patterns = ["PETOPIA", "NIBBLONIAN CHOW", "INTERSPECIES VET", "VET ", "PET SUPPL"]

[[category]]
name = "Indulgence"
kind = "spend"
  [[category.subcategory]]
  # Named to match the shipped default subcategory so casino spend that the
  # default "CASINO" pattern also catches merges into one row, not two.
  name = "Lottery & Gaming"
  patterns = ["CASINO", "BLACKJACK", "POKER", "SLOTS", "LOTTERY", "BET PALACE"]
  [[category.subcategory]]
  name = "Alcohol & Cannabis"
  patterns = ["LOBRAU", "LIQUOR", "BREWERY", "BEER", "BOOZE"]
  [[category.subcategory]]
  name = "Cigars & Smokes"
  patterns = ["CIGAR", "STOGIE", "SMOKE SHOP"]
  [[category.subcategory]]
  name = "Hobbies & Fun"
  patterns = ["COMIX", "ARCADE", "FUN CENTER", "GAME STOP"]
  [[category.subcategory]]
  name = "Travel"
  patterns = ["MARS VEGAS", "RESORT", "SPACE CRUISE"]
  [[category.subcategory]]
  name = "Gifts & Jewellery"
  patterns = ["WONG INDUSTRIES", "JEWELLERS"]

[[category]]
name = "Subscriptions"
kind = "spend"
  [[category.subcategory]]
  name = "Digital Subscriptions"
  patterns = ["HYPNOTOAD", "SLURMSTREAM", "EYEPHONE PLUS"]
  [[category.subcategory]]
  name = "Fitness"
  patterns = ["BENDING GYM", "KENDO DOJO", "DOJO", "GYM"]

[[category]]
name = "Self-care"
kind = "spend"
  [[category.subcategory]]
  name = "Clothing"
  patterns = ["WINNERS", "MARSHALLS", "FORTYNINER SPORTS"]

[[category]]
name = "Online Shopping"
kind = "spend"
  [[category.subcategory]]
  name = "Online Marketplaces"
  patterns = ["MOMAZON", "AMAZON"]
  [[category.subcategory]]
  name = "Electronics"
  patterns = ["NIMBUS ELECTRONICS"]

[[category]]
name = "Home & Utilities"
kind = "spend"
  [[category.subcategory]]
  name = "Telecom"
  patterns = ["MOMCORP MOBILE"]
  [[category.subcategory]]
  name = "Utilities"
  patterns = ["DOOP HYDRO", "HYDRO", "EARTH WATER", "WATER"]
  [[category.subcategory]]
  name = "Rent & Mortgage"
  patterns = ["RENT", "ROBOT ARMS"]
  priority = 5

[[category]]
name = "Income"
kind = "income"
  [[category.subcategory]]
  name = "Salary"
  patterns = ["PLANET EXPRESS PAYROLL", "IRONWORKS", "PAYROLL", "DIRECT DEPOSIT"]
  [[category.subcategory]]
  name = "Rent Income"
  # "RENT DEPOSIT" / "RENT FROM" are longer than the bare "RENT" spend pattern,
  # so rent RECEIVED from a tenant is correctly counted as income.
  patterns = ["RENT DEPOSIT", "RENT FROM"]
  [[category.subcategory]]
  name = "Inheritance & Cheques"
  patterns = ["ESTATE OF", "INHERITANCE", "CHEQUE DEPOSIT"]
  [[category.subcategory]]
  name = "Interest"
  patterns = ["INTEREST PAID", "INTEREST"]

[[category]]
name = "Transfers"
kind = "transfer"
  [[category.subcategory]]
  name = "Credit Card Payment"
  patterns = ["PAYMENT - THANK YOU", "BILL PAYMENT", "MASTERCARD", "VISA PAYMENT"]
  priority = 10
  [[category.subcategory]]
  name = "Savings & Investments"
  patterns = ["TRANSFER TO SAVINGS", "RRSP", "TFSA"]
  priority = 8
  [[category.subcategory]]
  name = "Internal / E-Transfer"
  patterns = ["INTERAC E-TRANSFER", "INTERAC ETRNSFR", "E-TRANSFER", "TRANSFER TO", "TRANSFER FROM"]
  priority = 5
