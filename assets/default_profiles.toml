# where-did-money-go — source profiles
#
# Each [[profile]] describes how to detect and parse one CSV export layout.
# Profiles are matched top-to-bottom; the FIRST profile whose `match` rules all
# succeed wins. Add a new source by appending a [[profile]] block — no recompile.
#
# Detection (`match`):
#   header_first_cell  = exact first header cell, AFTER stripping a UTF-8 BOM and
#                        surrounding quotes. May be a regex alternation "A|B".
#   header_contains    = list of substrings that must all appear in the header line.
#   content_probe      = regex that must match somewhere in the first few data rows
#                        (used to disambiguate layouts with identical headers).
#   filename           = optional regex on the file's basename; useful when two
#                        sources share an identical header (e.g. a chequing ledger
#                        vs a savings ledger) and only the filename distinguishes them.
#
# Parsing:
#   encoding="utf8"; has_bom; skip_blank_rows_after_header; delimiter.
#   [profile.date]    column + strptime `format`. Use %-m/%-d for no-leading-zero.
#                     `formats` (list) may be given for sources that mix zero-padded
#                     and non-padded dates; the first that parses wins.
#   [profile.amount]  column + `sign`: "signed" | "outflow_positive" |
#                     "separate_debit_credit" (then debit_column/credit_column).
#   [profile.merchant] column, optional strip_codes (regex prefix), trim.
#   [profile.memo]    column, optional category_harvest (regex w/ named group `cat`).
#   [profile.type]    column + map of raw value -> "spend"|"income"|"transfer".
#   [profile.person]  column carrying the cardholder/owner name, when present.
#   [profile.account] kind, currency, and id_from_filename (regex capture).

schema_version = 1

# ---- Credit card with a cardholder column (quoted fields, Date + Time) --------
[[profile]]
id = "mastercard_credit"
[profile.match]
header_first_cell = "Description"
header_contains   = ["Card Holder Name", "Time"]
[profile.date]
column = "Date"
format = "%m/%d/%Y"
[profile.amount]
column = "Amount"
sign   = "signed"
[profile.merchant]
column = "Description"
[profile.person]
column = "Card Holder Name"
[profile.type]
column = "Type"
map    = { PURCHASE = "spend", REFUND = "income", PAYMENT = "transfer" }
[profile.account]
kind     = "credit_card"
currency = "CAD"
id_from_filename = '(\d{4})'

# ---- Rewards credit card (carries a "Rewards earned ~ Category:" memo) --------
[[profile]]
id = "rewards_credit"
[profile.match]
header_first_cell = "Transaction date"
# Matched on headers alone: an export can hold only payments (empty memo), so
# requiring the "Rewards earned ~ Category:" memo would reject it.
header_contains   = ["Transaction", "Name", "Memo", "Amount"]
[profile.date]
column  = "Transaction date"
formats = ["%m/%d/%Y", "%-m/%-d/%Y"]
[profile.amount]
column = "Amount"
sign   = "signed"
[profile.merchant]
column = "Name"
[profile.memo]
column          = "Memo"
category_harvest = 'Category:\s*(?P<cat>.+?)\s*$'
[profile.type]
column = "Transaction"
map    = { DEBIT = "spend", CREDIT = "transfer" }
[profile.account]
kind     = "credit_card"
currency = "CAD"
id_from_filename = '(\d{4})'

# ---- Generic bank ledger (chequing AND savings share this layout) ------------
# Identical column layout for both; the account/owner is resolved from the
# filename via people.toml. Date may be zero-padded or not.
[[profile]]
id = "bank_ledger"
[profile.match]
header_first_cell = "Date"
header_contains   = ["Transaction", "Name", "Memo", "Amount"]
[profile.date]
column  = "Date"
formats = ["%m/%d/%Y", "%-m/%-d/%Y"]
[profile.amount]
column = "Amount"
sign   = "signed"
[profile.merchant]
column = "Name"
[profile.memo]
column = "Memo"
[profile.type]
column = "Transaction"
# DEBIT/CREDIT/OTHER: OTHER is ambiguous (could be transfer or income); leave it
# unmapped so categorization rules decide. CREDIT on a chequing account is usually
# income unless a transfer rule matches.
map = { DEBIT = "spend", CREDIT = "income" }
[profile.account]
kind     = "debit"
currency = "CAD"

# ---- Fixed-width card statement (UTF-8 BOM, blank rows, padded descriptions) --
[[profile]]
id = "first_bank_card"
[profile.match]
header_first_cell = "First Bank Card"
[profile.encoding]
has_bom = true
[profile.layout]
skip_blank_rows_after_header = 2
[profile.date]
column = "Date Posted"
format = "%Y%m%d"
[profile.amount]
column = " Transaction Amount"   # NOTE the real header has a leading space
sign   = "signed"
[profile.merchant]
column      = "Description"
strip_codes = '^\s*\[(?:CW|PR|OP|RN|MP)\]\s*'
trim        = "trailing_whitespace"
[profile.type]
column = "Transaction Type"
map    = { DEBIT = "spend", CREDIT = "income" }
[profile.account]
kind     = "debit"
currency = "CAD"
id_from_filename = '(\d{4})'

# ---- Ledger with the description split over three columns ---------------------
# Header: "ID, Date, Account Name, Description1, Description2, Description3,
# Amount, Balance" — note the space after each comma: it is part of the column
# names. Dates carry a (meaningless) time, e.g. "2026-03-31 12:00:00 AM"; the
# engine ignores a trailing time. The three description columns are joined.
[[profile]]
id = "split_description_ledger"
[profile.match]
header_first_cell = "ID"
header_contains   = [" Date", " Account Name", " Description1", " Description2", " Description3", " Amount", " Balance"]
[profile.date]
column  = " Date"
formats = ["%Y-%m-%d", "%Y-%-m-%-d"]
[profile.amount]
column = " Amount"
sign   = "signed"
[profile.merchant]
column        = " Description1"
extra_columns = [" Description2", " Description3"]
# No transaction-type column: classify by sign; categorization/transfer rules
# can still re-label a row (e.g. a transfer between your own accounts).
[profile.type.by_sign]
negative = "spend"
positive = "income"
[profile.account]
kind     = "debit"
currency = "CAD"
