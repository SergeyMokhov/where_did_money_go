[package]
name = "wdmg"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
description = "where-did-money-go: a personal finance statement analyzer"
license = "MIT OR Apache-2.0"

[[bin]]
name = "wdmg"
path = "src/main.rs"

[lib]
name = "wdmg"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
askama = "0.16"
blake3 = "1"
clap = { version = "4", features = ["derive"] }
csv = "1"
jiff = { version = "0.2", features = ["serde"] }
regex = "1"
rust_decimal = { version = "1", features = ["serde", "serde-with-str", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
toml = "0.8"
toml_edit = "0.22"

[dev-dependencies]
insta = "1"
proptest = "1"
rust_decimal_macros = "1"

[profile.test]
opt-level = 0
